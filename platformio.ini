; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; Board support: each [env:...] below is one ESP32 board. Pick yours from the
; PlatformIO Project Tasks tree in VS Code, or `pio run -e <name>` on the CLI.
; The board is selected entirely by build_flags -- src/main.cpp has no
; board-specific code of its own to edit.

[platformio]
default_envs =
	heltec_wifi_lora_32_V2

[env]
platform = espressif32
framework = arduino
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
monitor_speed = 115200
build_flags =
	-I./src
; ESP Async WebServer bundles TCP backends for several platforms; its LDF
; scan pulls in the RP2040-only one even for an ESP32 build unless told not
; to (pre-existing issue, unrelated to board support).
lib_ignore =
	AsyncTCP_RP2040W
; NOTE: fhessel/esp32_https_server was previously listed here but is never
; actually used by src/main.cpp (all HTTP/WS handling goes through ESP Async
; WebServer + WebSockets below), and no longer builds against current
; arduino-esp32 releases (it depends on a hwcrypto/sha.h header ESP-IDF has
; since removed). Dropped as dead weight while getting this to build at all.
;
; Every board's radio -- SX1276/77 and SX1262/68 alike -- now goes through
; RadioLib and this project's own lib/HasRadio HAL (see main.cpp), so
; RadioLib is a project-wide dependency rather than something only the
; SX126x boards further down pull in.
lib_deps =
	ESP Async WebServer
	links2004/WebSockets@^2.3.5
	ArduinoJson
	paulstoffregen/Time
	jgromes/RadioLib@^7.7.1

; -- Heltec WiFi LoRa 32 --------------------------------------------------
; These boards use the Heltec ESP32 Dev-Boards library for display/Vext/
; serial bring-up only (Heltec.begin() with LoRaEnable=false in main.cpp) --
; the radio itself is always a HasRadio subclass driven directly through
; RadioLib now, same as every other board in this project, so LORA_SCK/etc.
; pins are supplied here explicitly rather than left to Heltec.begin() to
; wire up internally. Pins (SCK=5, MISO=19, MOSI=27, CS=18, RST=14, DIO0=26)
; are shared identically across all of V1/V2/Wireless Stick/Wireless Stick
; Lite -- confirmed against arduino-esp32's own pins_arduino.h for each of
; these four board ids.
;
; The Heltec library also bundles a LoRaWAN stack we never call into, but
; its sources still get compiled as part of the library and expect
; LoRaWAN_DEBUG_LEVEL/SLOW_CLK_TPYE/HELTEC_BOARD (its own internal numeric
; board id, see ESP32_Mcu.h) to be defined -- harmless placeholders here.
;
; -DClass_Wifi_LoRa works around a real bug in
; heltecautomation/Heltec ESP32 Dev-Boards@^2.1.1 itself (confirmed on real
; heltec_wifi_lora_32_v3 hardware: Guru Meditation LoadProhibited inside
; Heltec.begin()): heltec.h defines "Class_WIFI_LORA" (all-caps LORA) for
; these boards, but heltec.cpp's Heltec_ESP32 constructor checks the
; differently-cased "Class_Wifi_LoRa" -- since preprocessor macros are
; case-sensitive, that check is never true, so "display" (an SSD1306Wire*)
; is never allocated even though Heltec_Screen (correctly using
; Class_WIFI_LORA) IS defined, and Heltec.begin() then calls display->init()
; on that null pointer. Has to be a build flag, not a #define in main.cpp --
; heltec.cpp is its own separate translation unit and never sees defines
; from ours. Re-check against whatever Heltec library version is pinned if
; it's ever upgraded; drop this once upstream fixes the case mismatch.
; Affects only the WIFI_LORA_32* boards, not Wireless Stick(Lite) --
; heltec.cpp's Wireless Stick branch already checks the correctly-cased raw
; WIRELESS_STICK macro.

[env:heltec_wifi_lora_32_v1]
board = heltec_wifi_lora_32
build_flags =
	${env.build_flags}
	-DWIFI_LORA_32
	-DHAS_OLED
	-DLoRaWAN_DEBUG_LEVEL=0
	-DSLOW_CLK_TPYE=0
	-DHELTEC_BOARD=1
	-DClass_Wifi_LoRa
	-DLORA_SCK=5
	-DLORA_MISO=19
	-DLORA_MOSI=27
	-DLORA_CS=18
	-DLORA_RST=14
	-DLORA_IRQ=26
lib_deps =
	${env.lib_deps}
	heltecautomation/Heltec ESP32 Dev-Boards@^2.1.1

[env:heltec_wifi_lora_32_V2]
board = heltec_wifi_lora_32_V2
build_flags =
	${env.build_flags}
	-DWIFI_LORA_32_V2
	-DHAS_OLED
	-DLoRaWAN_DEBUG_LEVEL=0
	-DSLOW_CLK_TPYE=0
	-DHELTEC_BOARD=0
	-DClass_Wifi_LoRa
	-DLORA_SCK=5
	-DLORA_MISO=19
	-DLORA_MOSI=27
	-DLORA_CS=18
	-DLORA_RST=14
	-DLORA_IRQ=26
lib_deps =
	${env.lib_deps}
	heltecautomation/Heltec ESP32 Dev-Boards@^2.1.1

; V3's real chip is an SX1262, not the SX1276 every other Heltec board here
; has -- confirmed on real hardware (Heltec.begin()'s own LoRa init hangs the
; CPU forever trying to detect a chip it doesn't recognize, an unconditional
; while(1) in heltec.cpp). Heltec.begin() is still used for display/Vext/
; serial (LoRaEnable=false, see main.cpp); the radio goes through the same
; HasRadioSX126x class the other five SX126x boards below use. Pins are from
; Meshtastic's own shipping variant file for this exact board
; (variants/esp32s3/heltec_v3/variant.h in meshtastic/firmware).
[env:heltec_wifi_lora_32_v3]
board = heltec_wifi_lora_32_V3
build_flags =
	${env.build_flags}
	-DWIFI_LORA_32_V3
	-DLoRaWAN_DEBUG_LEVEL=0
	-DSLOW_CLK_TPYE=0
	-DHELTEC_BOARD=30
	-DHAS_OLED
	-DClass_Wifi_LoRa
	-DLORA_SCK=9
	-DLORA_MISO=11
	-DLORA_MOSI=10
	-DLORA_CS=8
	-DLORA_RST=12
	-DLORA_IRQ=SX126X_DIO1
	-DSX126X_DIO1=14
	-DSX126X_BUSY=13
	-DSX126X_DIO2_AS_RF_SWITCH
	-DSX126X_TCXO_VOLTAGE=1.8
lib_deps =
	${env.lib_deps}
	heltecautomation/Heltec ESP32 Dev-Boards@^2.1.1

[env:heltec_wireless_stick]
board = heltec_wireless_stick
build_flags =
	${env.build_flags}
	-DWIRELESS_STICK
	-DHAS_OLED
	-DLoRaWAN_DEBUG_LEVEL=0
	-DSLOW_CLK_TPYE=0
	-DHELTEC_BOARD=2
	-DLORA_SCK=5
	-DLORA_MISO=19
	-DLORA_MOSI=27
	-DLORA_CS=18
	-DLORA_RST=14
	-DLORA_IRQ=26
lib_deps =
	${env.lib_deps}
	heltecautomation/Heltec ESP32 Dev-Boards@^2.1.1

; Wireless Stick Lite drops the tiny OLED strip the plain Wireless Stick
; has (cheapest Heltec variant) -- no HAS_OLED here, matching the hardware.
[env:heltec_wireless_stick_lite]
board = heltec_wireless_stick_lite
build_flags =
	${env.build_flags}
	-DWIRELESS_STICK_LITE
	-DLoRaWAN_DEBUG_LEVEL=0
	-DSLOW_CLK_TPYE=0
	-DHELTEC_BOARD=3
	-DLORA_SCK=5
	-DLORA_MISO=19
	-DLORA_MOSI=27
	-DLORA_CS=18
	-DLORA_RST=14
	-DLORA_IRQ=26
lib_deps =
	${env.lib_deps}
	heltecautomation/Heltec ESP32 Dev-Boards@^2.1.1

; -- LILYGO/TTGO boards (generic radio path) --------------------------------
; No Heltec-style all-in-one library here: main.cpp drives the SX127x and
; SSD1306 OLED directly using the pin names PlatformIO's board variant
; already defines for these (LORA_SCK/LORA_MISO/..., OLED_SDA/OLED_SCL).

[env:ttgo_lora32_v1]
board = ttgo-lora32-v1
build_flags =
	${env.build_flags}
	-DTTGO_LORA32_V1
	-DHAS_OLED
lib_deps =
	${env.lib_deps}
	thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@^4.4.0

[env:ttgo_lora32_v2]
board = ttgo-lora32-v2
build_flags =
	${env.build_flags}
	-DTTGO_LORA32_V2
	-DHAS_OLED
lib_deps =
	${env.lib_deps}
	thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@^4.4.0

[env:ttgo_lora32_v21]
board = ttgo-lora32-v21
build_flags =
	${env.build_flags}
	-DTTGO_LORA32_V21
	-DHAS_OLED
lib_deps =
	${env.lib_deps}
	thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@^4.4.0

; -- LILYGO/TTGO T-Beam ------------------------------------------------------
; No built-in OLED. The LoRa radio and GPS are power-gated by an AXP192 PMU
; that has to be switched on before they'll respond (see initPMU() in
; main.cpp) -- this is the one board here that needs that extra step.

[env:ttgo_tbeam]
board = ttgo-t-beam
build_flags =
	${env.build_flags}
	-DTTGO_TBEAM
	-DHAS_AXP192
lib_deps =
	${env.lib_deps}
	lewisxhe/AXP202X_Library@^1.1.3

; -- LILYGO T3-S3 (SX1262) ---------------------------------------------------
; PlatformIO's "lilygo-t3-s3" board maps to the generic esp32s3 variant, so
; unlike the SX127x boards above there's no ready-made pins_arduino.h to pull
; LORA_*/OLED_* from -- these pins are hand-sourced from Meshtastic's own
; shipping support for this board (variants/esp32s3/tlora_t3s3_v1/variant.h
; in meshtastic/firmware), since Meshtastic actually ships firmware for it.
[env:lilygo_t3_s3]
board = lilygo-t3-s3
build_flags =
	${env.build_flags}
	-DLILYGO_T3_S3
	-DHAS_OLED
	-DLORA_SCK=5
	-DLORA_MISO=3
	-DLORA_MOSI=6
	-DLORA_CS=7
	-DLORA_RST=8
	; No DIO0 on an SX126x; initLoRaRadio()'s hvRadio.begin() call doesn't use
	; this directly, so it's just an alias to keep that shared function
	; compiling unchanged for this board too.
	-DLORA_IRQ=SX126X_DIO1
	-DSX126X_DIO1=33
	-DSX126X_BUSY=34
	-DSX126X_DIO2_AS_RF_SWITCH
	-DSX126X_TCXO_VOLTAGE=1.8
	-DOLED_SDA=18
	-DOLED_SCL=17
lib_deps =
	${env.lib_deps}
	thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@^4.4.0

; -- B&Q Station G2 (SX1262 + SH1107 OLED) -----------------------------------
; Same HasRadioSX126x class as T3-S3 above, just different pins -- no code
; changes needed for the radio side. The OLED is a 1.3" SH1107 though, not
; the SSD1306 every other board here uses, so this pulls in Adafruit_SH110X
; and main.cpp's SH110XOLEDAdapter<Adafruit_SH1107> instead of SSD1306Wire.
; Pins are from Meshtastic's shared station_common.h
; (variants/esp32s3/station-common in meshtastic/firmware), which G2 and G3
; both build on.
; No dedicated PlatformIO board id exists for Station G2, so this builds on
; the generic ESP32-S3 devkit profile rather than borrowing another vendor's
; board identity/USB PID.
[env:bq_station_g2]
board = esp32-s3-devkitc-1
build_flags =
	${env.build_flags}
	-DBQ_STATION_G2
	-DHAS_OLED
	-DLORA_SCK=12
	-DLORA_MISO=14
	-DLORA_MOSI=13
	-DLORA_CS=11
	-DLORA_RST=21
	-DLORA_IRQ=SX126X_DIO1
	-DSX126X_DIO1=48
	-DSX126X_BUSY=47
	-DSX126X_DIO2_AS_RF_SWITCH
	-DSX126X_TCXO_VOLTAGE=1.8
	-DSX126X_MAX_POWER=19
	-DOLED_SDA=5
	-DOLED_SCL=6
lib_deps =
	${env.lib_deps}
	adafruit/Adafruit SH110X@^2.1.15

; -- LILYGO T-Beam Supreme / T-Beam S3-Core (SX1262 + SH1106 OLED + AXP2101) -
; Radio is the same HasRadioSX126x class again, just different pins. The
; OLED is a SH1106 (not SH1107), so this reuses the SH110X adapter template
; with Adafruit_SH1106G instead. The real addition here is the PMU: this
; board's LoRa radio, OLED, and sensors are all power-gated by an AXP2101 --
; a different chip from the AXP192 the original T-Beam v1.1 uses, reached on
; the ESP32's second I2C bus (Wire1) shared with an onboard PCF8563 RTC.
; Rail assignments (ALDO1/2/3) and pins are from Meshtastic's own
; variants/esp32s3/tbeam-s3-core/variant.h and src/Power.cpp
; (LILYGO_TBEAM_S3_CORE branch) in meshtastic/firmware. GNSS (ALDO4), the
; M.2 slot (DCDC3), and the SD card (BLDO1) are deliberately left off --
; nothing in this project uses them.
; No dedicated PlatformIO board id exists for this board either.
[env:tbeam_supreme]
board = esp32-s3-devkitc-1
build_flags =
	${env.build_flags}
	-DTBEAM_SUPREME
	-DHAS_OLED
	-DHAS_AXP2101
	-DPMU_USE_WIRE1
	-DI2C_SDA1=42
	-DI2C_SCL1=41
	-DLORA_SCK=12
	-DLORA_MISO=13
	-DLORA_MOSI=11
	-DLORA_CS=10
	-DLORA_RST=5
	-DLORA_IRQ=SX126X_DIO1
	-DSX126X_DIO1=1
	-DSX126X_BUSY=4
	-DSX126X_DIO2_AS_RF_SWITCH
	-DSX126X_TCXO_VOLTAGE=1.8
	-DOLED_SDA=17
	-DOLED_SCL=18
lib_deps =
	${env.lib_deps}
	adafruit/Adafruit SH110X@^2.1.15
	lewisxhe/XPowersLib@^0.3.3

; -- Heltec Wireless Tracker (SX1262 + ST7735 color TFT) ---------------------
; Radio is the same HasRadioSX126x class again -- just different pins.
; The display is the real departure: no OLED at all, but a color ST7735 TFT
; on its own dedicated SPI bus (separate from the LoRa radio's SPI pins).
; VEXT_ENABLE gates power to the TFT (and GPS, which this project doesn't
; use) and has to be driven high before the panel responds.
; Pins are from Meshtastic's variants/esp32s3/heltec_wireless_tracker in
; meshtastic/firmware. Panel geometry (INITR_MINI160x80, landscape) is
; inferred from their TFT_WIDTH/HEIGHT/OFFSET_X defines for this board, not
; confirmed on real hardware -- see project_state.md.
[env:heltec_wireless_tracker]
board = esp32-s3-devkitc-1
build_flags =
	${env.build_flags}
	-DHELTEC_WIRELESS_TRACKER
	-DHAS_OLED
	-DLORA_SCK=9
	-DLORA_MISO=11
	-DLORA_MOSI=10
	-DLORA_CS=8
	-DLORA_RST=12
	-DLORA_IRQ=SX126X_DIO1
	-DSX126X_DIO1=14
	-DSX126X_BUSY=13
	-DSX126X_DIO2_AS_RF_SWITCH
	-DSX126X_TCXO_VOLTAGE=1.8
	-DST7735_CS=38
	-DST7735_RS=40
	-DST7735_SDA=42
	-DST7735_SCK=41
	-DST7735_RESET=39
	-DVEXT_ENABLE=3
	-DVEXT_ON_VALUE=HIGH
lib_deps =
	${env.lib_deps}
	adafruit/Adafruit ST7735 and ST7789 Library@^1.11.0
