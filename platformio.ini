; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; Board support: each [env:...] below is one ESP32 board. Pick yours from the
; PlatformIO Project Tasks tree in VS Code, or `pio run -e <name>` on the CLI.
; The board is selected entirely by build_flags -- src/main.cpp has no
; board-specific code of its own to edit.

[platformio]
default_envs =
	heltec_wifi_lora_32_V2

[env]
platform = espressif32
framework = arduino
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
monitor_speed = 115200
build_flags =
	-I./src
; ESP Async WebServer bundles TCP backends for several platforms; its LDF
; scan pulls in the RP2040-only one even for an ESP32 build unless told not
; to (pre-existing issue, unrelated to board support).
lib_ignore =
	AsyncTCP_RP2040W
; NOTE: fhessel/esp32_https_server was previously listed here but is never
; actually used by src/main.cpp (all HTTP/WS handling goes through ESP Async
; WebServer + WebSockets below), and no longer builds against current
; arduino-esp32 releases (it depends on a hwcrypto/sha.h header ESP-IDF has
; since removed). Dropped as dead weight while getting this to build at all.
lib_deps =
	ESP Async WebServer
	links2004/WebSockets@^2.3.5
	ArduinoJson
	paulstoffregen/Time

; -- Heltec WiFi LoRa 32 --------------------------------------------------
; These three share the Heltec ESP32 Dev-Boards library, which owns the
; radio/OLED init (Heltec.begin()) instead of main.cpp talking to pins
; directly. That library also bundles a LoRaWAN stack we never call into,
; but its sources still get compiled as part of the library and expect
; LoRaWAN_DEBUG_LEVEL/SLOW_CLK_TPYE/HELTEC_BOARD (its own internal numeric
; board id, see ESP32_Mcu.h) to be defined -- harmless placeholders here
; since main.cpp only ever touches the plain Heltec.LoRa radio object.

[env:heltec_wifi_lora_32_v1]
board = heltec_wifi_lora_32
build_flags =
	${env.build_flags}
	-DWIFI_LORA_32
	-DHAS_OLED
	-DLoRaWAN_DEBUG_LEVEL=0
	-DSLOW_CLK_TPYE=0
	-DHELTEC_BOARD=1
lib_deps =
	${env.lib_deps}
	heltecautomation/Heltec ESP32 Dev-Boards@^2.1.1

[env:heltec_wifi_lora_32_V2]
board = heltec_wifi_lora_32_V2
build_flags =
	${env.build_flags}
	-DWIFI_LORA_32_V2
	-DHAS_OLED
	-DLoRaWAN_DEBUG_LEVEL=0
	-DSLOW_CLK_TPYE=0
	-DHELTEC_BOARD=0
lib_deps =
	${env.lib_deps}
	heltecautomation/Heltec ESP32 Dev-Boards@^2.1.1

[env:heltec_wifi_lora_32_v3]
board = heltec_wifi_lora_32_V3
build_flags =
	${env.build_flags}
	-DWIFI_LORA_32_V3
	-DLoRaWAN_DEBUG_LEVEL=0
	-DSLOW_CLK_TPYE=0
	-DHELTEC_BOARD=30
	-DHAS_OLED
lib_deps =
	${env.lib_deps}
	heltecautomation/Heltec ESP32 Dev-Boards@^2.1.1

[env:heltec_wireless_stick]
board = heltec_wireless_stick
build_flags =
	${env.build_flags}
	-DWIRELESS_STICK
	-DHAS_OLED
	-DLoRaWAN_DEBUG_LEVEL=0
	-DSLOW_CLK_TPYE=0
	-DHELTEC_BOARD=2
lib_deps =
	${env.lib_deps}
	heltecautomation/Heltec ESP32 Dev-Boards@^2.1.1

; Wireless Stick Lite drops the tiny OLED strip the plain Wireless Stick
; has (cheapest Heltec variant) -- no HAS_OLED here, matching the hardware.
[env:heltec_wireless_stick_lite]
board = heltec_wireless_stick_lite
build_flags =
	${env.build_flags}
	-DWIRELESS_STICK_LITE
	-DLoRaWAN_DEBUG_LEVEL=0
	-DSLOW_CLK_TPYE=0
	-DHELTEC_BOARD=3
lib_deps =
	${env.lib_deps}
	heltecautomation/Heltec ESP32 Dev-Boards@^2.1.1

; -- LILYGO/TTGO boards (generic radio path) --------------------------------
; No Heltec-style all-in-one library here: main.cpp drives the SX127x and
; SSD1306 OLED directly using the pin names PlatformIO's board variant
; already defines for these (LORA_SCK/LORA_MISO/..., OLED_SDA/OLED_SCL). The
; standalone LoRa library doesn't define RF_PACONFIG_PASELECT_PABOOST the way
; the Heltec library's bundled fork does, so it's supplied here as its real
; equivalent, PA_OUTPUT_PA_BOOST_PIN (1) -- every one of these boards' SX127x
; radios is wired to the PA_BOOST RF output, not RFO.
[generic_radio]
build_flags =
	-DRF_PACONFIG_PASELECT_PABOOST=1

[env:ttgo_lora32_v1]
board = ttgo-lora32-v1
build_flags =
	${env.build_flags}
	${generic_radio.build_flags}
	-DTTGO_LORA32_V1
	-DHAS_OLED
lib_deps =
	${env.lib_deps}
	sandeepmistry/LoRa@^0.8.0
	thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@^4.4.0

[env:ttgo_lora32_v2]
board = ttgo-lora32-v2
build_flags =
	${env.build_flags}
	${generic_radio.build_flags}
	-DTTGO_LORA32_V2
	-DHAS_OLED
lib_deps =
	${env.lib_deps}
	sandeepmistry/LoRa@^0.8.0
	thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@^4.4.0

[env:ttgo_lora32_v21]
board = ttgo-lora32-v21
build_flags =
	${env.build_flags}
	${generic_radio.build_flags}
	-DTTGO_LORA32_V21
	-DHAS_OLED
lib_deps =
	${env.lib_deps}
	sandeepmistry/LoRa@^0.8.0
	thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@^4.4.0

; -- LILYGO/TTGO T-Beam ------------------------------------------------------
; No built-in OLED. The LoRa radio and GPS are power-gated by an AXP192 PMU
; that has to be switched on before they'll respond (see initPMU() in
; main.cpp) -- this is the one board here that needs that extra step.

[env:ttgo_tbeam]
board = ttgo-t-beam
build_flags =
	${env.build_flags}
	${generic_radio.build_flags}
	-DTTGO_TBEAM
	-DHAS_AXP192
lib_deps =
	${env.lib_deps}
	sandeepmistry/LoRa@^0.8.0
	lewisxhe/AXP202X_Library@^1.1.3

; -- LILYGO T3-S3 (SX1262, first RadioLib board) ----------------------------
; PlatformIO's "lilygo-t3-s3" board maps to the generic esp32s3 variant, so
; unlike the SX127x boards above there's no ready-made pins_arduino.h to pull
; LORA_*/OLED_* from -- these pins are hand-sourced from Meshtastic's own
; shipping support for this board (variants/esp32s3/tlora_t3s3_v1/variant.h
; in meshtastic/firmware), since Meshtastic actually ships firmware for it.
[env:lilygo_t3_s3]
board = lilygo-t3-s3
build_flags =
	${env.build_flags}
	${generic_radio.build_flags}
	-DLILYGO_T3_S3
	-DHAS_OLED
	-DLORA_SCK=5
	-DLORA_MISO=3
	-DLORA_MOSI=6
	-DLORA_CS=7
	-DLORA_RST=8
	; No DIO0 on an SX126x; initLoRaRadio()'s hvLoRa.setPins() call ignores
	; this argument for the RadioLibSX126x adapter, so it's just an alias
	; to keep that shared function compiling unchanged for this board too.
	-DLORA_IRQ=SX126X_DIO1
	-DSX126X_DIO1=33
	-DSX126X_BUSY=34
	-DSX126X_DIO2_AS_RF_SWITCH
	-DSX126X_TCXO_VOLTAGE=1.8
	-DOLED_SDA=18
	-DOLED_SCL=17
lib_deps =
	${env.lib_deps}
	jgromes/RadioLib@^7.7.1
	thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@^4.4.0
